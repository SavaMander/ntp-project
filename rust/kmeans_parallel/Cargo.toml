[package]
name = "kmeans_parallel"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "main"
path = "src/main.rs"

[[bin]]
name = "weak"
path = "src/weak.rs"

[[bin]]
name = "visualize"
path = "src/visualize.rs"

[dependencies]
num_cpus = "1.16"
rand_xorshift = "0.3"
rand = "0.8"
csv = "1.3"
ndarray = "0.16"  # Changed from 0.15 to match linfa
linfa = "0.8"
linfa-reduction = "0.8"
plotters = "0.3"